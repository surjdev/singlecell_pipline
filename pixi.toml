[workspace]
name = "single_cell_pipeline"
version = "0.2.0"
description = "Smart-seq2 & Full-length scRNA-seq / Transcriptomic pipeline (FastQC, fastp, STAR, HISAT2, featureCounts, MultiQC)"
authors = ["Antigravity Bio Team"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64", "linux-aarch64"]

[dependencies]
python = ">=3.11,<3.13"
fastp = ">=0.23.4"
fastqc = ">=0.12.1"
multiqc = ">=1.21"
cutadapt = ">=4.8"
star = ">=2.7.11b"
hisat2 = ">=2.2.1"
subread = ">=2.0.6"
samtools = ">=1.19"
anndata = ">=0.10.0"
scanpy = ">=1.10.0"
leidenalg = ">=0.10.0"
python-igraph = ">=0.11.0"
umap-learn = ">=0.5.5"
gseapy = ">=1.1.0"
scikit-learn = ">=1.4.0"
statsmodels = ">=0.14.0"
pandas = ">=2.2.0"
numpy = ">=1.26.0"
scipy = ">=1.12.0"
matplotlib-base = ">=3.8.0"
seaborn = ">=0.13.0"
pyyaml = ">=6.0"
biopython = ">=1.83"
rich = ">=13.7.0"
click = ">=8.1.7"
tqdm = ">=4.66.0"
jupyterlab = ">=4.1.0"
ipykernel = ">=6.29.0"
nbformat = ">=5.9.0"
nbclient = ">=0.10.0"
plotly = ">=5.20.0"
jinja2 = ">=3.1.0"

[tasks]
generate-sample-data = "python -m src.sc_data_generator --num-cells 8 --reads-per-cell 500"
qc-raw = "python -m src.pipeline qc --stage raw"
trim = "python -m src.pipeline trim"
align-star = "python -m src.pipeline align --aligner star"
align-hisat2 = "python -m src.pipeline align --aligner hisat2"
quant-featurecounts = "python -m src.pipeline quant --method featurecounts"
quant-star = "python -m src.pipeline quant --method star"
qc-clean = "python -m src.pipeline qc --stage clean"
multiqc-report = "python -m src.pipeline multiqc"
downstream = "python -m src.pipeline downstream"
full-pipeline = "python -m src.pipeline full"
jupyter = "jupyter lab --ip=0.0.0.0 --port=8888 --no-browser"
test-notebooks = "python -m src.utils --test-notebooks"


