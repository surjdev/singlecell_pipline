[workspace]
name = "single_cell_pipeline"
version = "1.0.0"
description = "Pure Bash & Nextflow Upstream Pipeline for Smart-seq2 / Plate-based Single-Cell RNA-seq (FastQC, fastp, STAR, Subread/featureCounts, MultiQC)"
authors = ["Surj", "Antigravity Bio Team"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
fastp = ">=0.23.4"
fastqc = ">=0.12.1"
multiqc = ">=1.21"
star = ">=2.7.11b"
hisat2 = ">=2.2.1"
subread = ">=2.0.6"
samtools = ">=1.19"
nextflow = ">=23.10.0"

[tasks]
download = "bash scripts/download_data.sh"
setup-ref = "bash scripts/setup_reference.sh --species human --sjdbOverhang 42"
qc-raw = "bash scripts/qc_data_00.sh"
fastp = "bash scripts/fastp_01.sh"
align = "bash scripts/align_02.sh"
quant = "bash scripts/quant_03.sh"
multiqc = "bash scripts/multiqc_04.sh"
run-all = "bash scripts/run_all.sh"
nf-run = "nextflow run nextflow/main.nf -profile local"
